name: CrohniqDock
options:
  bundleIdPrefix: ch.crohniq
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: FW84ZL64CN
    DEVELOPMENT_LANGUAGE: de
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "32"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  CrohniqDock:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Crohniq Dock
        CFBundleName: Crohniq Dock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleIconName: AppIcon
        NSCalendarsFullAccessUsageDescription: Das Kalender-Widget zeigt deine nächsten Termine.
        NSRemindersFullAccessUsageDescription: Das Erinnerungen-Widget zeigt und erledigt deine Erinnerungen.
        NSLocationUsageDescription: Das Wetter-Widget zeigt das Wetter an deinem aktuellen Standort.
        NSLocationWhenInUseUsageDescription: Das Wetter-Widget zeigt das Wetter an deinem aktuellen Standort.
        NSMicrophoneUsageDescription: Das Sprachmemo-Widget nimmt Audio auf.
        NSPhotoLibraryUsageDescription: Das Fotos-Widget zeigt Bilder aus deiner Apple-Fotomediathek an.
        NSAppleEventsUsageDescription: Crohniq Dock steuert Musik, Spotify, Mail, Notizen, Kalender und Systemeinstellungen für die Widgets.
        NSContactsUsageDescription: Das Mail-Widget gleicht Absender mit deinen Kontakten ab, wenn „Bekannte Absender“ ausgewählt ist.
    entitlements:
      path: CrohniqDock.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.application-groups:
          - FW84ZL64CN.ch.crohniq.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: crohniq.dock.ch
        PRODUCT_NAME: Crohniq Dock
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        REGISTER_APP_GROUPS: YES
